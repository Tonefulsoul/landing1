            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .landing-image:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.20);
        }

        /* Mobile */
        @media (max-width: 600px) {
            .landing-page {
                padding: 10px;

            }
