<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Canva Website</title>

    <style>
        /* Remove default browser spacing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            overflow-x: hidden;
        }

        /* Main responsive container */
        .canva-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        /*
         * Canva embed area
         *
         * The content inside this container will automatically
         * adjust to the available screen width.
         */
        .canva-responsive {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 ratio */
            overflow: hidden;
        }

        .canva-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .canva-responsive {
                padding-bottom: 75%;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .canva-responsive {
                padding-bottom: 100%;
            }
        }
    </style>
</head>
