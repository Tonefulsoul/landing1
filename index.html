<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Mobile / tablet / desktop scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio Website</title>

    <style>
        /* ==========================================
           GENERAL PAGE SETTINGS
           ========================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            overflow-x: hidden;
        }


        /* ==========================================
           CANVA WEBSITE AREA
           
           YOUR CANVA HTML GOES INSIDE THIS AREA
           ========================================== */

        .canva-website {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            min-height: 100vh;
        }


        /* ==========================================
           >>> PASTE YOUR CANVA HTML BELOW <<<
           ========================================== */

        .canva-content {
            width: 100%;
            min-height: 100vh;
        }

        /*
        =================================================

        PASTE YOUR CANVA-GENERATED HTML HERE.

        For example:

        <div class="your-canva-website">
            ...
            YOUR CANVA HTML
            ...
        </div>

        =================================================
        */


        /* ==========================================
           RESPONSIVE IMAGES
           ========================================== */

        .canva-content img {
            max-width: 100%;
            height: auto;
        }


        /* ==========================================
           RESPONSIVE VIDEOS
           ========================================== */

        .canva-content video {
            max-width: 100%;
            height: auto;
        }


        /* ==========================================
           TABLETS
           ========================================== */

        @media (max-width: 1024px) {

            .canva-website {
                width: 100%;
            }

            .canva-content {
                width: 100%;
            }
        }


        /* ==========================================
           MOBILE PHONES
           ========================================== */

        @media (max-width: 600px) {

            .canva-website {
                width: 100%;
                margin: 0;
            }

            .canva-content {
                width: 100%;
                min-height: 100vh;
            }

            /*
            Prevent large fixed-width Canva elements
            from creating horizontal scrolling.
            */

            .canva-content > * {
                max-width: 100%;
            }
        }


        /* ==========================================
           SMALL PHONES
           ========================================== */

        @media (max-width: 380px) {

            .canva-content {
                font-size: 95%;
            }
        }

    </style>
</head>
